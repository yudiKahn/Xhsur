<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/shiurim" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>{{ 'dailyLesson.cards.hayomYom' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <main class="hayom-yom-layout siddur-text-body">
    <nav class="hayom-yom-navigation" aria-label="ניווט בין תאריכים">
      <ion-button
        fill="clear"
        [disabled]="!canGoPrevious()"
        [attr.aria-label]="'dailyLesson.navigation.previous' | translate"
        (click)="goPrevious()"
      >
        <ion-icon slot="icon-only" name="chevron-back-outline"></ion-icon>
      </ion-button>
      <span aria-live="polite">{{ currentWeekday() }} {{ currentKey() }}</span>
      <ion-button
        fill="clear"
        [disabled]="!canGoNext()"
        [attr.aria-label]="'dailyLesson.navigation.next' | translate"
        (click)="goNext()"
      >
        <ion-icon slot="icon-only" name="chevron-forward-outline"></ion-icon>
      </ion-button>
    </nav>
    @if (entry(); as today) {
      @for (paragraph of paragraphs; track $index) {
        <p>{{ paragraph }}</p>
      }
    } @else {
      <p class="hayom-yom-empty">{{ 'dailyLesson.hayomYomUnavailable' | translate }}</p>
    }
  </main>
</ion-content>
