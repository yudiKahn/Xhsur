<ion-header class="home-header">
  <ion-toolbar class="home-toolbar">
    <ion-buttons slot="start">
      <ion-button id="home-menu-trigger" class="home-toolbar__menu-btn" fill="clear">
        <ion-icon slot="icon-only" name="menu"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <div class="home-toolbar__day">יום חמישי י' אב</div>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-popover #aboutPopover trigger="home-menu-trigger" triggerAction="click" side="bottom" alignment="end">
  <ng-template>
    <ion-list class="home-menu-list">
      <ion-item button routerLink="/about" (click)="aboutPopover.dismiss()">
        <ion-icon slot="start" name="information-circle-outline"></ion-icon>
        <ion-label>{{ 'about.title' | translate }}</ion-label>
      </ion-item>
    </ion-list>
  </ng-template>
</ion-popover>

<ion-content class="home-content">
  <main class="home-layout">
    <!-- <a
      class="home-info-button"
      routerLink="/about"
      [attr.aria-label]="'about.title' | translate"
    >
      <ion-icon name="information"></ion-icon>
    </a> -->

    <header class="home-hero">
      <!-- <img class="home-brand-mark" src="assets/icons/siddur.svg" alt="" /> -->
      <h1>{{ 'app.title' | translate }}</h1>
    </header>

    <section class="preset-group" [attr.aria-label]="'home.choosePrayer' | translate">
      @for (preset of primaryPresets; track trackByPreset($index, preset)) {
        <button class="prayer-card" type="button" (click)="openPreset(preset)">
          <!-- <img class="prayer-card__icon" [src]="getPresetIcon(preset.id)" alt="" /> -->
          <span class="prayer-card__title">{{ preset.titleKey | translate }}</span>
          <span class="prayer-card__chevron" aria-hidden="true">›</span>
        </button>
      }
    </section>

    

    <section class="preset-group secondary" [attr.aria-label]="'home.additionalPrayers' | translate">
      @for (preset of supplementalPresets; track trackByPreset($index, preset)) {
        <button class="prayer-card" type="button" (click)="openPreset(preset)">
          <!-- <img class="prayer-card__icon" [src]="getPresetIcon(preset.id)" alt="" /> -->
          <span class="prayer-card__title">{{ preset.titleKey | translate }}</span>
          <span class="prayer-card__chevron" aria-hidden="true">›</span>
        </button>
      }
    </section>
  </main>
</ion-content>
